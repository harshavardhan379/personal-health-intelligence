[tool.ruff]
line-length = 100
# Pinned to py39 (not py312, the Docker runtime target) so `ruff --fix` doesn't
# rewrite Optional[X]/List[X] into 3.10+ `X | None` / list[X] syntax that would
# break local dev on this machine's Python 3.9. Bump this once local dev is on 3.10+.
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...)-as-default is the documented, idiomatic pattern,
# not a bug — calling it per-request is how FastAPI's DI is designed to work.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Added by directory in tests/conftest.py, so `pytest -m "not integration"` skips the Postgres tests.
markers = [
    "unit: fast tests with no external service (tests/unit)",
    "safety: the prohibited and high-risk query suite (tests/safety)",
    "benchmark: the evaluation framework (tests/evaluation)",
    "regression: AI regression, fixed questions with expected properties (tests/regression)",
    "integration: needs Postgres, built from the real migrations (tests/integration, tests/regression)",
]

[tool.coverage.run]
source = ["services", "packages"]
branch = false

[tool.coverage.report]
skip_covered = true
show_missing = true
# The one thing the suite cannot cover here: the OCR branches need the tesseract program.
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
