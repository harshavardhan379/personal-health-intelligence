<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Health Intelligence</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Personal Health Intelligence</h1>
    <p>Demo prototype. Use synthetic data only. Not medical advice.</p>
  </header>

  <main>
    <section id="upload">
      <h2>Upload a report</h2>
      <p>Supported: PDF, JPG, JPEG, PNG</p>
      <input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png">
      <button type="button" id="upload-button">Upload</button>
      <p id="upload-status">No file uploaded yet.</p>
    </section>

    <section id="timeline">
      <h2>Health timeline</h2>
      <ul id="timeline-list">
        <li>Nothing here yet. Upload a report to get started.</li>
      </ul>
    </section>
  </main>
</body>
</html>
