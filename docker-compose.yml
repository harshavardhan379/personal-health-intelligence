# DEVELOPMENT stack. The production one is docker-compose.prod.yml; the API image defaults to
# ENVIRONMENT=production, so this file says development explicitly.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: phi
      POSTGRES_PASSWORD: phi_dev_password
      POSTGRES_DB: phi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phi"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://phi:phi_dev_password@postgres:5432/phi
      CORS_ORIGINS: '["http://localhost:3000"]'
      JWT_SECRET: dev-only-secret-change-me
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_storage:
